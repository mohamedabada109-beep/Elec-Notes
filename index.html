<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مفكرة ومحرك بحث الهندسة الكهربية | Mohamed Abada</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    body.light {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --accent: #0284c7;
      --accent-2: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 24px 16px 56px;
    }

    .author-banner {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.14), rgba(34, 197, 94, 0.12));
      border: 1px solid var(--border);
      border-right: 4px solid var(--accent);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.94rem;
    }

    .author-banner strong {
      color: var(--accent);
    }

    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 0.95rem;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.15s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #06131e;
      border-color: transparent;
      font-weight: 600;
    }

    .btn-accent-2 {
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent-2);
      border-color: rgba(34, 197, 94, 0.35);
      font-weight: 600;
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow);
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 240px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-meta {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .external-search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 0.88rem;
      color: var(--muted);
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-btn {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.88rem;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #06131e;
      border-color: transparent;
      font-weight: 600;
    }

    .lookup-box {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: 4px solid var(--warning);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .lookup-box.show {
      display: block;
    }

    .lookup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .lookup-title {
      font-weight: 700;
      color: var(--warning);
      font-size: 1rem;
    }

    .lookup-text {
      font-size: 0.94rem;
      color: var(--text);
    }

    .add-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .add-panel.open {
      display: block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .field input, .field select, .field textarea {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }

    .field textarea {
      min-height: 95px;
      resize: vertical;
    }

    .section-heading {
      margin-bottom: 12px;
      font-size: 1.05rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 600;
    }

    .code-tag {
      font-family: Consolas, monospace;
      font-size: 0.8rem;
      color: var(--accent-2);
      background: rgba(34, 197, 94, 0.12);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .card h3 {
      font-size: 1.08rem;
      margin-top: 8px;
    }

    .card-body {
      color: var(--text);
      font-size: 0.94rem;
      white-space: pre-line;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .mini-tag {
      font-size: 0.76rem;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      gap: 8px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 28px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
    }

    footer {
      margin-top: 32px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="author-banner">
      <div>مفكرة هندسية وبحث مفتوح في علوم الهندسة الكهربية والأكواد.</div>
      <div dir="ltr">Created &amp; curated by <strong>Mohamed Abada</strong></div>
    </div>

    <header>
      <div>
        <h1>مفكرة ومحرك بحث الهندسة الكهربية</h1>
        <p>ابحث في ملاحظاتك المحفوظة، أو استعرض المصطلحات والاختصارات، أو ابحث مفتوحاً في المصادر الخارجية</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" id="toggleAddBtn">+ إضافة ملح
