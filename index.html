<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electrical Notes | Mohamed Abada</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 14px 48px;
    }
    .credit {
      background: #1e293b;
      border-right: 4px solid #38bdf8;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .top {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .search-box {
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    input, textarea {
      font-family: inherit;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
    }
    #searchInput {
      flex: 1;
      min-width: 200px;
    }
    button, a.btn {
      font-family: inherit;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
    }
    .btn-blue {
      background: #38bdf8;
      color: #06131e;
      font-weight: bold;
    }
    .btn-gray {
      background: #334155;
      color: #f8fafc;
    }
    .btn-red {
      background: #dc2626;
      color: #fff;
      padding: 6px 10px;
      font-size: 12px;
    }
    #addBox {
      display: none;
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    #addBox.open {
      display: block;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 16px;
      color: #38bdf8;
    }
    .card p {
      margin: 0 0 12px;
      font-size: 14px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="credit" dir="ltr">Created &amp; curated by <strong>Mohamed Abada</strong></div>

    <div class="top">
      <h1 style="margin:0; font-size:20px;">مفكرة الهندسة الكهربية</h1>
      <button class="btn-blue" id="openAdd">+ إضافة ملحوظة</button>
    </div>

    <div id="addBox">
      <div style="margin-bottom:10px;">
        <input id="noteTitle" type="text" placeholder="عنوان الملحوظة" style="width:100%;" />
      </div>
      <div style="margin-bottom:10px;">
        <textarea id="noteText" rows="4" placeholder="اكتب الملحوظة هنا..." style="width:100%;"></textarea>
      </div>
      <button class="btn-blue" id="saveNote">حفظ</button>
      <button class="btn-gray" id="cancelNote">إلغاء</button>
    </div>

    <div class="search-box">
      <input id="searchInput" type="search" placeholder="ابحث في ملاحظاتك أو اكتب أي موضوع للبحث عنه في Google..." />
      <a class="btn btn-gray" id="googleSearch" href="https://www.google.com/search?q=electrical+engineering" target="_blank" rel="noopener noreferrer">بحث Google</a>
    </div>

    <div class="grid" id="notesList"></div>
  </div>

  <script>
    const KEY = "mohamed_abada_simple_notes_v1";
    const initial = [
      { id: 1, title: "توزيع البرايز (NEC)", text: "أقصى مسافة لأي نقطة على الحائط من أقرب بريزة 1.8 م، وبين كل بريزتين حوالي 3.65 م مع مراعاة الأبواب والفرش." },
      { id: 2, title: "كابل CAT6A F/FTP vs S/FTP", text: "F/FTP: فويل لكل زوج + فويل خارجي عام. S/FTP: فويل لكل زوج + شبكة مضفورة (Braid) خارجية." },
      { id: 3, title: "بوندنج لوحة LCP", text: "لا يُفضل مد بوندنج لمسافة طويلة من غرفة التيار الخفيف للوحة LCP بعيدة؛ الأفضل الاعتماد على PE المغذي أو أقرب بارة تأريض." }
    ];

    let items = JSON.parse(localStorage.getItem(KEY) || "null") || initial;

    function save() {
      localStorage.setItem(KEY, JSON.stringify(items));
    }

    function draw() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      document.getElementById("googleSearch").href =
        "https://www.google.com/search?q=" + encodeURIComponent(q || "electrical engineering");

      const list = document.getElementById("notesList");
      const filtered = items.filter(x => !q || x.title.toLowerCase().includes(q) || x.text.toLowerCase().includes(q));

      if (!filtered.length) {
        list.innerHTML = '<div class="card"><p>مفيش ملحوظة مطابقة هنا، جرب تدوس "بحث Google" للبحث عن الموضوع بره.</p></div>';
        return;
      }

      list.innerHTML = filtered.map(x => `
        <div class="card">
          <h3>${x.title}</h3>
          <p>${x.text}</p>
          <button class="btn-red" onclick="removeNote(${x.id})">حذف</button>
        </div>
      `).join("");
    }

    window.removeNote = function(id) {
      items = items.filter(x => x.id !== id);
      save();
      draw();
    };

    document.getElementById("openAdd").onclick = () => {
      document.getElementById("addBox").classList.toggle("open");
    };
    document.getElementById("cancelNote").onclick = () => {
      document.getElementById("addBox").classList.remove("open");
    };
    document.getElementById("saveNote").onclick = () => {
      const title = document.getElementById("noteTitle").value.trim();
      const text = document.getElementById("noteText").value.trim();
      if (!title || !text) return;
      items.unshift({ id: Date.now(), title, text });
      save();
      document.getElementById("noteTitle").value = "";
      document.getElementById("noteText").value = "";
      document.getElementById("addBox").classList.remove("open");
      draw();
    };
    document.getElementById("searchInput").oninput = draw;

    draw();
  </script>
</body>
</html>
