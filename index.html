<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electrical Notes | Mohamed Abada</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    body.light {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --accent: #0284c7;
      --accent-2: #16a34a;
      --danger: #dc2626;
      --shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 24px 16px 56px;
    }

    .author-banner {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.14), rgba(34, 197, 94, 0.12));
      border: 1px solid var(--border);
      border-right: 4px solid var(--accent);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 18px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: 0.94rem;
    }

    .author-banner strong {
      color: var(--accent);
    }

    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 0.95rem;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #06131e;
      border-color: transparent;
      font-weight: 600;
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-meta {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-btn {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #06131e;
      border-color: transparent;
      font-weight: 600;
    }

    .add-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .add-panel.open {
      display: block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .field input, .field select, .field textarea {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }

    .field textarea {
      min-height: 95px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 600;
    }

    .code-tag {
      font-family: Consolas, monospace;
      font-size: 0.78rem;
      color: var(--accent-2);
      background: rgba(34, 197, 94, 0.12);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .card h3 {
      font-size: 1.06rem;
      margin-top: 8px;
    }

    .card-body {
      color: var(--text);
      font-size: 0.93rem;
      white-space: pre-line;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      gap: 8px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
    }

    footer {
      margin-top: 32px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="author-banner" dir="ltr">
      <div>Created &amp; curated by <strong>Mohamed Abada</strong></div>
    </div>

    <header>
      <div>
        <h1>مفكرة الهندسة الكهربية</h1>
        <p>نوتس سريعة ومرتبة لأقسام القوى (Power) والتيار الخفيف (ELV)</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" id="toggleAddBtn">+ إضافة ملحوظة</button>
        <button class="btn" id="themeBtn">الوضع النهاري</button>
      </div>
    </header>

    <section class="add-panel" id="addPanel">
      <h2 style="font-size: 1.15rem; margin-bottom: 12px;">إضافة ملحوظة جديدة</h2>
      <form id="noteForm">
        <div class="form-grid">
          <div class="field">
            <label for="titleInput">عنوان الملحوظة *</label>
            <input type="text" id="titleInput" required placeholder="مثال: معامل التنوع أو ارتفاع كاميرا" />
          </div>
          <div class="field">
            <label for="categoryInput">التصنيف *</label>
            <select id="categoryInput">
              <optgroup label="Power">
                <option value="Power - Load Estimation">1 - Load Estimation</option>
                <option value="Power - Lighting Design">2 - Lighting Design</option>
                <option value="Power - Small Power">3 - Small Power</option>
                <option value="Power - Power for Mechanical">4 - Power for Mechanical</option>
                <option value="Power - Panel Board Schedule">5 - Panel Board Schedule</option>
                <option value="Power - Street Lighting">6 - Street Lighting</option>
                <option value="Power - Earthing & Lightning">7 - Earthing &amp; Lightning</option>
                <option value="Power - Bulk Equipment">8 - Bulk Equipment</option>
                <option value="Power - Infrastructure">9 - Infrastructure</option>
                <option value="Power - Cable Routing">10 - Cable Routing</option>
                <option value="Power - Electrical Spaces">11 - Electrical Spaces</option>
                <option value="Power - BOQ">12 - BOQ</option>
              </optgroup>
              <optgroup label="ELV">
                <option value="ELV - Fire Alarm">1 - Fire Alarm</option>
                <option value="ELV - Structured Cabling">2 - Structured Cabling</option>
                <option value="ELV - CCTV">3 - CCTV</option>
                <option value="ELV - MATV / SMATV / IPTV">4 - MATV / SMATV / IPTV</option>
                <option value="ELV - Public Address">5 - Public Address</option>
                <option value="ELV - Voice Evacuation">6 - Voice Evacuation</option>
                <option value="ELV - Nurse Call">7 - Nurse Call</option>
                <option value="ELV - Parking">8 - Parking</option>
                <option value="ELV - Audio Visual">9 - Audio Visual</option>
                <option value="ELV - Digital Signage">10 - Digital Signage</option>
                <option value="ELV - BMS">11 - BMS</option>
              </optgroup>
            </select>
          </div>
          <div class="field">
            <label for="codeInput">كود / مرجع (اختياري)</label>
            <input type="text" id="codeInput" placeholder="مثال: IEC 60364 / NFPA 72 / TIA-568" />
          </div>
        </div>
        <div class="field" style="margin-bottom: 12px;">
          <label for="bodyInput">نص الملحوظة *</label>
          <textarea id="bodyInput" required placeholder="اكتب التفاصيل الهندسية هنا..."></textarea>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn" id="cancelAddBtn">إلغاء</button>
          <button type="submit" class="btn btn-primary">حفظ الملحوظة</button>
        </div>
      </form>
    </section>

    <section class="controls">
      <div class="search-row">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="ابحث بأي كلمة في كل الأقسام (Power, ELV, Transformer, CCTV, BMS, BOQ...)"
        />
        <span class="search-meta" id="resultsCount"></span>
      </div>
      <div class="categories" id="categoryBar">
        <button class="cat-btn active" data-cat="ALL">الكل</button>
        <button class="cat-btn" data-cat="GROUP_POWER">كل Power (12)</button>
        <button class="cat-btn" data-cat="GROUP_ELV">كل ELV (11)</button>
        <button class="cat-btn" data-cat="Power - Load Estimation">1. Load Estimation</button>
        <button class="cat-btn" data-cat="Power - Lighting Design">2. Lighting Design</button>
        <button class="cat-btn" data-cat="Power - Small Power">3. Small Power</button>
        <button class="cat-btn" data-cat="Power - Power for Mechanical">4. Power for Mechanical</button>
        <button class="cat-btn" data-cat="Power - Panel Board Schedule">5. Panel Board Schedule</button>
        <button class="cat-btn" data-cat="Power - Street Lighting">6. Street Lighting</button>
        <button class="cat-btn" data-cat="Power - Earthing & Lightning">7. Earthing &amp; Lightning</button>
        <button
