<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electrical Reference | Mohamed Abada</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    body.light {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --accent: #0284c7;
      --accent-2: #16a34a;
      --danger: #dc2626;
      --shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 24px 16px 56px;
    }

    .author-banner {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.14), rgba(34, 197, 94, 0.12));
      border: 1px solid var(--border);
      border-right: 4px solid var(--accent);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 18px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: 0.94rem;
    }

    .author-banner strong {
      color: var(--accent);
    }

    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 0.95rem;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #06131e;
      border-color: transparent;
      font-weight: 600;
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-meta {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-btn {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #06131e;
      border-color: transparent;
      font-weight: 600;
    }

    .add-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .add-panel.open {
      display: block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .field input, .field select, .field textarea {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }

    .field textarea {
      min-height: 95px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 600;
    }

    .code-tag {
      font-family: Consolas, monospace;
      font-size: 0.78rem;
      color: var(--accent-2);
      background: rgba(34, 197, 94, 0.12);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .card h3 {
      font-size: 1.06rem;
      margin-top: 8px;
    }

    .card-body {
      color: var(--text);
      font-size: 0.92rem;
      white-space: pre-line;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      gap: 8px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
    }

    footer {
      margin-top: 32px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="author-banner" dir="ltr">
      <div>Created &amp; curated by <strong>Mohamed Abada</strong></div>
    </div>

    <header>
      <div>
        <h1>مرجع الهندسة الكهربية</h1>
        <p>شرح مبسط لمعنى كل بند في Power و ELV وخطوات تنفيذه باختصار</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" id="toggleAddBtn">+ إضافة معلومة</button>
        <button class="btn" id="themeBtn">الوضع النهاري</button>
      </div>
    </header>

    <section class="add-panel" id="addPanel">
      <h2 style="font-size: 1.15rem; margin-bottom: 12px;">إضافة معلومة جديدة</h2>
      <form id="noteForm">
        <div class="form-grid">
          <div class="field">
            <label for="titleInput">عنوان المعلومة *</label>
            <input type="text" id="titleInput" required placeholder="مثال: معامل التنوع أو ارتفاع كاميرا" />
          </div>
          <div class="field">
            <label for="categoryInput">التصنيف *</label>
            <select id="categoryInput">
              <optgroup label="Power">
                <option value="Power - Load Estimation">1 - Load Estimation</option>
                <option value="Power - Lighting Design">2 - Lighting Design</option>
                <option value="Power - Small Power">3 - Small Power</option>
                <option value="Power - Power for Mechanical">4 - Power for Mechanical</option>
                <option value="Power - Panel Board Schedule">5 - Panel Board Schedule</option>
                <option value="Power - Street Lighting">6 - Street Lighting</option>
                <option value="Power - Earthing & Lightning">7 - Earthing &amp; Lightning</option>
                <option value="Power - Bulk Equipment">8 - Bulk Equipment</option>
                <option value="Power - Infrastructure">9 - Infrastructure</option>
                <option value="Power - Cable Routing">10 - Cable Routing</option>
                <option value="Power - Electrical Spaces">11 - Electrical Spaces</option>
                <option value="Power - BOQ">12 - BOQ</option>
              </optgroup>
              <optgroup label="ELV">
                <option value="ELV - Fire Alarm">1 - Fire Alarm</option>
                <option value="ELV - Structured Cabling">2 - Structured Cabling</option>
                <option value="ELV - CCTV">3 - CCTV</option>
                <option value="ELV - MATV / SMATV / IPTV">4 - MATV / SMATV / IPTV</option>
                <option value="ELV - Public Address">5 - Public Address</option>
                <option value="ELV - Voice Evacuation">6 - Voice Evacuation</option>
                <option value="ELV - Nurse Call">7 - Nurse Call</option>
                <option value="ELV - Parking">8 - Parking</option>
                <option value="ELV - Audio Visual">9 - Audio Visual</option>
                <option value="ELV - Digital Signage">10 - Digital Signage</option>
                <option value="ELV - BMS">11 - BMS</option>
              </optgroup>
            </select>
          </div>
          <div class="field">
            <label for="codeInput">كود / مرجع (اختياري)</label>
            <input type="text" id="codeInput" placeholder="مثال: IEC 60364 / NFPA 72 / TIA-568" />
          </div>
        </div>
        <div class="field" style="margin-bottom: 12px;">
          <label for="bodyInput">الشرح (معناه إيه وبنعمله إزاي) *</label>
          <textarea id="bodyInput" required placeholder="معناه إيه: ... بنعمله إزاي: ..."></textarea>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn" id="cancelAddBtn">إلغاء</button>
          <button type="submit" class="btn btn-primary">حفظ المعلومة</button>
        </div>
      </form>
    </section>

    <section class="controls">
      <div class="search-row">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="ابحث بأي كلمة في كل الأقسام (Power, ELV, Transformer, CCTV, BMS, BOQ...)"
        />
        <span class="search-meta" id="resultsCount"></span>
      </div>
      <div class="categories" id="categoryBar">
        <button class="cat-btn active" data-cat="ALL">الكل</button>
        <button class="cat-btn" data-cat="GROUP_POWER">كل Power (12)</button>
        <button class="cat-btn" data-cat="GROUP_ELV">كل ELV (11)</button>
        <button class="cat-btn" data-cat="Power - Load Estimation">1. Load Estimation</button>
        <button class="cat-btn" data-cat="Power - Lighting Design">2. Lighting Design</button>
        <button class="cat-btn" data-cat="Power - Small Power">3. Small Power</button>
        <button class="cat-btn" data-cat="Power - Power for Mechanical">4. Power for Mechanical</button>
        <button class="cat-btn" data-cat="Power - Panel Board Schedule">5. Panel Board Schedule</button>
        <button class="cat-btn" data-cat="Power - Street Lighting">6. Street Lighting</button>
        <button class="cat-btn" data-cat="Power - Earthing & Lightning">7. Earthing &amp; Lightning</button>
        <button class="cat-btn" data-cat="Power - Bulk Equipment">8. Bulk Equipment</button>
        <button class="cat-btn" data-cat="Power - Infrastructure">9. Infrastructure</button>
        <button class="cat-btn" data-cat="Power - Cable Routing">10. Cable Routing</button>
        <button class="cat-btn" data-cat="Power - Electrical Spaces">11. Electrical Spaces</button>
        <button class="cat-btn" data-cat="Power - BOQ">12. BOQ</button>
        <button class="cat-btn" data-cat="ELV - Fire Alarm">1. Fire Alarm</button>
        <button class="cat-btn" data-cat="ELV - Structured Cabling">2. Structured Cabling</button>
        <button class="cat-btn" data-cat="ELV - CCTV">3. CCTV</button>
        <button class="cat-btn" data-cat="ELV - MATV / SMATV / IPTV">4. MATV/SMATV/IPTV</button>
        <button class="cat-btn" data-cat="ELV - Public Address">5. Public Address</button>
        <button class="cat-btn" data-cat="ELV - Voice Evacuation">6. Voice Evacuation</button>
        <button class="cat-btn" data-cat="ELV - Nurse Call">7. Nurse Call</button>
        <button class="cat-btn" data-cat="ELV - Parking">8. Parking</button>
        <button class="cat-btn" data-cat="ELV - Audio Visual">9. Audio Visual</button>
        <button class="cat-btn" data-cat="ELV - Digital Signage">10. Digital Signage</button>
        <button class="cat-btn" data-cat="ELV - BMS">11. BMS</button>
      </div>
    </section>

    <main class="grid" id="notesGrid"></main>

    <footer dir="ltr">
      Created &amp; curated by <strong>Mohamed Abada</strong>
    </footer>
  </div>

  <script>
    var STORAGE_KEY = 'elec_ref_mohamed_abada_v2';

    var defaultNotes = [
      {
        id: 'p1',
        group: 'POWER',
        category: 'Power - Load Estimation',
        code: 'IEC / NEC',
        title: '1 - Load Estimation',
        body: [
          'معناه إيه: حساب إجمالي الحمل الكهربي المتوقع للمشروع لتحديد سعات المحولات والمولدات واللوحات والكابلات.',
          'بنعمله إزاي: نحصر الأحمال حسب طبيعة الفراغ والمعدة، ونفصلها لـ Normal و Essential و UPS، ثم نطبق Demand و Diversity و Power Factor مع هامش توسع.'
        ].join('\n')
      },
      {
        id: 'p2',
        group: 'POWER',
        category: 'Power - Lighting Design',
        code: 'DIALux / EN 12464',
        title: '2 - Lighting Design',
        body: [
          'معناه إيه: توزيع كشافات الإنارة الداخلية والطوارئ لتحقيق مستوى إضاءة مناسب وراحة بصرية وتوفير للطاقة.',
          'بنعمله إزاي: نحدد الـ Lux والـ UGR والـ CRI حسب نوع الفراغ، ونوزع الكشافات ونراجعها بالحسابات أو DIALux، ثم نقسم الدوائر مع مراعاة الطوارئ.'
        ].join('\n')
      },
      {
        id: 'p3',
        group: 'POWER',
        category: 'Power - Small Power',
        code: 'NEC 210 / IEC 60364',
        title: '3 - Small Power',
        body: [
          'معناه إيه: توفير برايز ومخارج قوى للأجهزة والمعدات الخفيفة في مختلف الفراغات.',
          'بنعمله إزاي: نوزع البرايز حسب الفرش والاستخدام، ونعمل دوائر مستقلة للأحمال الكبيرة أو الحساسة، ونستخدم RCD/GFCI في الأماكن الرطبة.'
        ].join('\n')
      },
      {
        id: 'p4',
        group: 'POWER',
        category: 'Power - Power for Mechanical',
        code: 'MEP Coordination',
        title: '4 - Power for Mechanical',
        body: [
          'معناه إيه: تغذية وتشغيل وحماية معدات الميكانيكا مثل التكييف والطلمبات والمراوح والتشيلرات.',
          'بنعمله إزاي: نراجع جدول أحمال الميكانيكا والجهد والطور وتيار البدء، ونوفر Isolator محلي قريب من المعدة، وننسق إشارات التشغيل والـ Trip.'
        ].join('\n')
      },
      {
        id: 'p5',
        group: 'POWER',
        category: 'Power - Panel Board Schedule',
        code: 'IEC 61439',
        title: '5 - Panel Board Schedule',
        body: [
          'معناه إيه: جدول يوضح بيانات كل دائرة في اللوحة من حمل وقاطع ومقاس كابل وهبوط جهد وتيار قصر.',
          'بنعمله إزاي: نوازن الأحمال على الفازات الثلاث، ونحسب القاطع والكابل والـ Voltage Drop، ونترك Spare/Reserve مناسب ونكتب اسم واضح لكل دائرة.'
        ].join('\n')
      },
      {
        id: 'p6',
        group: 'POWER',
        category: 'Power - Street Lighting',
        code: 'CIE / Road Standards',
        title: '6 - Street Lighting',
        body: [
          'معناه إيه: إنارة الطرق والممرات والمواقف الخارجية لتأمين الرؤية والحركة ليلاً.',
          'بنعمله إزاي: نحدد ارتفاع العمود والمسافات والقدرة حسب عرض الطريق، ونربطها بلوحة إنارة شوارع فيها Contactor و Photocell/Timer وحماية كاملة.'
        ].join('\n')
      },
      {
        id: 'p7',
        group: 'POWER',
        category: 'Power - Earthing & Lightning',
        code: 'IEC 62305 / IEC 60364',
        title: '7 - Earthing & Lightning',
        body: [
          'معناه إيه: حماية الأشخاص والمعدات من الصدمات الكهربية وتفريغ تيارات الأعطال والصواعق بأمان.',
          'بنعمله إزاي: ننفذ شبكة تأريض بمقاومة منخفضة مع Equipotential Bonding، ونحدد نظام الحماية من الصواعق والـ SPD حسب تقييم المخاطر.'
        ].join('\n')
      },
      {
        id: 'p8',
        group: 'POWER',
        category: 'Power - Bulk Equipment',
        code: 'IEC 60076 / IEC 60947',
        title: '8 - Bulk Equipment',
        body: [
          'معناه إيه: المعدات الرئيسية في المنظومة مثل Distributor و Transformer و Generator و UPS واللوحات العمومية.',
          'بنعمله إزاي: نحدد سعاتها وتيار القصر والتبريد والتهوية والـ Harmonics، ونراجع زمن التحويل ومدة بطاريات الـ UPS.'
        ].join('\n')
      },
      {
        id: 'p9',
        group: 'POWER',
        category: 'Power - Infrastructure',
        code: 'Site & Trenching',
        title: '9 - Infrastructure',
        body: [
          'معناه إيه: شبكات ومسارات الكابلات الخارجية في الموقع بين المباني والمصدر الرئيسي أو غرف الكهرباء.',
          'بنعمله إزاي: ننسق مسارات الخنادق والـ Duct banks مع باقي الخدمات، ونراعي العمق والرمل و Warning tape وغرف التفتيش.'
        ].join('\n')
      },
      {
        id: 'p10',
        group: 'POWER',
        category: 'Power - Cable Routing',
        code: 'Tray / Trunk / Conduit',
        title: '10 - Cable Routing',
        body: [
          'معناه إيه: تنظيم مسارات الكابلات داخل المبنى عبر المواسير أو الترانك أو حوامل الكابلات.',
          'بنعمله إزاي: نختار المسار المناسب ونلتزم بنسبة الملء والانحناء، ونفصل القوى عن الداتا لتقليل التداخل الكهرومغناطيسي.'
        ].join('\n')
      },
      {
        id: 'p11',
        group: 'POWER',
        category: 'Power - Electrical Spaces',
        code: 'Room Sizing & Access',
        title: '11 - Electrical Spaces',
        body: [
          'معناه إيه: غرف المحولات واللوحات والبطاريات والـ MDF/IDF وشروط تشغيلها وصيانتها.',
          'بنعمله إزاي: نحدد مساحة كافية للمعدات وحركة الفنيين وفتح الأبواب للخارج، وننسق التهوية أو التكييف والصرف والطوارئ والحريق.'
        ].join('\n')
      },
      {
        id: 'p12',
        group: 'POWER',
        category: 'Power - BOQ',
        code: 'Estimation & Specs',
        title: '12 - BOQ',
        body: [
          'معناه إيه: جدول الكميات والمواصفات الفنية للبنود الكهربائية المستخدمة في التسعير والتوريد والتنفيذ.',
          'بنعمله إزاي: نفرّغ الكميات من المخططات بالوحدة المناسبة، ونطابق التوصيف مع المواصفات، ونشمل الملحقات والاختبارات والتشغيل.'
        ].join('\n')
      },
      {
        id: 'e1',
        group: 'ELV',
        category: 'ELV - Fire Alarm',
        code: 'NFPA 72 / EN 54',
        title: '1 - Fire Alarm',
        body: [
          'معناه إيه: منظومة إنذار الحريق لاكتشاف الدخان أو الحرارة أو الكواشف اليدوية وتنبيه المتواجدين.',
          'بنعمله إزاي: نوزع Detectors و Manual Call Points و Horns/Strobes، ونمد كابلات Fire Rated بمسارات آمنة، ونربط إشارات الفصل والتحكم.'
        ].join('\n')
      },
      {
        id: 'e2',
        group: 'ELV',
        category: 'ELV - Structured Cabling',
        code: 'TIA-568 / ISO 11801',
        title: '2 - Structured Cabling',

    var notes = loadNotes();
    var activeCategory = 'ALL';
    var searchQuery = '';

    function loadNotes() {
      try {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          var parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {
        console.error(e);
      }
      return defaultNotes.slice();
    }

    function saveNotes() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      } catch (e) {
        console.error(e);
      }
    }

    function normalizeText(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/[إأآا]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/[\u064B-\u065F]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function matchesSearch(note, rawQuery) {
      var normalizedQuery = normalizeText(rawQuery);
      if (!normalizedQuery) return true;

      var searchableBlob = normalizeText([
        note.title,
        note.group || '',
        note.category,
        note.code || '',
        note.body
      ].join(' '));

      var tokens = normalizedQuery.split(' ');
      for (var i = 0; i < tokens.length; i++) {
        if (searchableBlob.indexOf(tokens[i]) === -1) return false;
      }
      return true;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderNotes() {
      var grid = document.getElementById('notesGrid');
      var countEl = document.getElementById('resultsCount');

      var filtered = [];
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        var catMatch = true;
        if (activeCategory === 'GROUP_POWER') {
          catMatch = n.group === 'POWER' || String(n.category).indexOf('Power') === 0;
        } else if (activeCategory === 'GROUP_ELV') {
          catMatch = n.group === 'ELV' || String(n.category).indexOf('ELV') === 0;
        } else if (activeCategory !== 'ALL') {
          catMatch = n.category === activeCategory;
        }
        if (catMatch && matchesSearch(n, searchQuery)) {
          filtered.push(n);
        }
      }

      countEl.textContent = 'عدد النتائج: ' + filtered.length + ' من أصل ' + notes.length;

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">لا توجد معلومات مطابقة للبحث أو التصنيف الحالي.</div>';
        return;
      }

      var html = '';
      for (var j = 0; j < filtered.length; j++) {
        var item = filtered[j];
        var copyPayload = item.title + (item.code ? ' (' + item.code + ')' : '') + '\n' + item.body;
        html +=
          '<article class="card">' +
            '<div>' +
              '<div class="card-top">' +
                '<span class="badge">' + escapeHtml(item.category) + '</span>' +
                (item.code ? '<span class="code-tag">' + escapeHtml(item.code) + '</span>' : '') +
              '</div>' +
              '<h3>' + escapeHtml(item.title) + '</h3>' +
              '<p class="card-body" style="margin-top: 8px;">' + escapeHtml(item.body) + '</p>' +
            '</div>' +
            '<div class="card-footer">' +
              '<button class="btn copy-btn" data-copy="' + escapeHtml(copyPayload) + '">نسخ</button>' +
              '<button class="btn btn-danger delete-btn" data-id="' + escapeHtml(item.id) + '">حذف</button>' +
            '</div>' +
          '</article>';
      }
      grid.innerHTML = html;

      var copyBtns = document.querySelectorAll('.copy-btn');
      for (var c = 0; c < copyBtns.length; c++) {
        copyBtns[c].addEventListener('click', function() {
          var text = this.getAttribute('data-copy') || '';
          var btnRef = this;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
              var old = btnRef.textContent;
              btnRef.textContent = 'تم النسخ';
              setTimeout(function() { btnRef.textContent = old; }, 1200);
            }).catch(function() {
              alert('تعذر النسخ تلقائياً');
            });
          } else {
            alert('تعذر النسخ تلقائياً');
          }
        });
      }

      var delBtns = document.querySelectorAll('.delete-btn');
      for (var d = 0; d < delBtns.length; d++) {
        delBtns[d].addEventListener('click', function() {
          var id = this.getAttribute('data-id');
          var nextNotes = [];
          for (var k = 0; k < notes.length; k++) {
            if (notes[k].id !== id) nextNotes.push(notes[k]);
          }
          notes = nextNotes;
          saveNotes();
          renderNotes();
        });
      }
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      searchQuery = e.target.value;
      renderNotes();
    });

    document.getElementById('categoryBar').addEventListener('click', function(e) {
      var btn = e.target.closest('.cat-btn');
      if (!btn) return;
      var allCats = document.querySelectorAll('.cat-btn');
      for (var i = 0; i < allCats.length; i++) {
        allCats[i].classList.remove('active');
      }
      btn.classList.add('active');
      activeCategory = btn.getAttribute('data-cat');
      renderNotes();
    });

    var addPanel = document.getElementById('addPanel');
    document.getElementById('toggleAddBtn').addEventListener('click', function() {
      addPanel.classList.toggle('open');
    });
    document.getElementById('cancelAddBtn').addEventListener('click', function() {
      addPanel.classList.remove('open');
    });

    document.getElementById('noteForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var title = document.getElementById('titleInput').value.trim();
      var category = document.getElementById('categoryInput').value;
      var code = document.getElementById('codeInput').value.trim();
      var body = document.getElementById('bodyInput').value.trim();
      if (!title || !body) return;

      notes.unshift({
        id: 'n_' + Date.now(),
        group: category.indexOf('ELV') === 0 ? 'ELV' : 'POWER',
        category: category,
        code: code,
        body: body
      });

      saveNotes();
      e.target.reset();
      addPanel.classList.remove('open');
      renderNotes();
    });

    var themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', function() {
      document.body.classList.toggle('light');
      themeBtn.textContent = document.body.classList.contains('light') ? 'الوضع الليلي' : 'الوضع النهاري';
    });

    renderNotes();
  </script>
